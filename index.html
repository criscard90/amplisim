<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmpRig WebStudio</title>
    
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/faustwasm@latest/dist/index.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060411 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(16px);
            --accent: #ff5e36;
            --accent-glow: rgba(255, 94, 54, 0.4);
            --text-main: #f0f0f8;
            --text-muted: #8a8a9e;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 1.5rem; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        .brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
        
        .controls-master { display: flex; align-items: center; gap: 16px; }
        
        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            backdrop-filter: var(--glass-blur);
        }
        
        .btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.25); }
        .btn-accent { background: var(--accent); border: none; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-accent:hover { background: #ff7350; transform: translateY(-1px); }
        .btn-accent.active { background: #00e676; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4); }
        
        main {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            padding: 24px;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        
        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .sidebar h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        
        .effects-catalog { display: flex; flex-direction: column; gap: 12px; }
        
        .effect-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .effect-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateX(4px);
        }
        
        .effect-info h3 { font-size: 0.95rem; font-weight: 600; }
        .effect-info p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        
        .rig-container {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .rig-header { display: flex; justify-content: space-between; align-items: center; }
        
        .pedalboard {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
            padding-bottom: 16px;
            min-height: 380px;
        }
        
        .pedal-slot {
            background: rgba(20, 18, 35, 0.6);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            width: 220px;
            min-width: 220px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* Overlay scuro sopra l'immagine di sfondo per leggibilità testo */
        .pedal-slot::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 12, 30, 0.72);
            border-radius: 16px;
            z-index: 0;
            transition: background 0.2s ease;
        }
        
        .pedal-slot.collapsed::before {
            background: rgba(15, 12, 30, 0.82);
        }
        
        .pedal-slot > * {
            position: relative;
            z-index: 1;
        }
        
        /* Quando il pedale è ridotto, mostra l'immagine "collapsed" */
        .pedal-slot.collapsed {
            background-image: var(--bg-collapsed) !important;
            min-height: 80px;
            height: 80px;
        }
        
        .pedal-slot.dragging { opacity: 0.4; transform: scale(0.95); }
        .pedal-slot.collapsed .pedal-controls { display: none; }
        .pedal-icone { color: var(--accent); font-size: 0.9rem; cursor: default; }
        .pedal-actions i.pedal-collapse:hover { color: var(--accent); }
        .effect-icon { color: var(--accent); font-size: 0.9rem; margin-bottom: 4px; }
        
        .pedal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px;
        }
        
        .pedal-title { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
        .pedal-actions { display: flex; gap: 14px; align-items: center; }
        .pedal-actions i { cursor: pointer; color: var(--text-muted); font-size: 0.85rem; transition: color 0.2s; }
        .pedal-actions i:hover { color: #ff5252; }
        
        .knob-container { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 8px; }
        .knob-label { font-size: 0.75rem; color: var(--text-muted); }
        .knob-input { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .knob-value { font-size: 0.7rem; color: var(--accent); font-weight: 600; min-width: 36px; text-align: center; background: rgba(255,94,54,0.1); border-radius: 6px; padding: 1px 4px; }
        
        .status-bar {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: #ff5252; }
        .status-indicator.active { background: #00e676; box-shadow: 0 0 8px #00e676; }
        
        /* Custom confirm modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 4, 17, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFadeIn 0.2s ease;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-dialog {
            background: linear-gradient(135deg, rgba(25, 22, 45, 0.95) 0%, rgba(18, 15, 35, 0.98) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            animation: modalSlideIn 0.25s ease;
        }
        
        @keyframes modalSlideIn {
            from { transform: translateY(-20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .modal-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 94, 54, 0.15);
            border: 1px solid rgba(255, 94, 54, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        .modal-icon i {
            font-size: 1.3rem;
            color: var(--accent);
        }
        
        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        
        .modal-message {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .btn-modal {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--glass-border);
            font-family: inherit;
        }
        
        .btn-modal-cancel {
            background: var(--glass-bg);
            color: var(--text-main);
        }
        
        .btn-modal-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }
        
        .btn-modal-confirm {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        
        .btn-modal-confirm:hover {
            background: #ff7350;
            transform: translateY(-1px);
        }
        
        /* Preset bar */
        .preset-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-top: 1px solid var(--glass-border);
            margin-top: 8px;
        }
        
        .preset-bar-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        .btn-preset {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--glass-border);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-preset-save {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 3px 12px var(--accent-glow);
        }
        
        .btn-preset-save:hover {
            background: #ff7350;
            transform: translateY(-1px);
        }
        
        .btn-preset-load {
            background: var(--glass-bg);
            color: var(--text-main);
        }
        
        .btn-preset-load:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }
        
        /* Preset list in modal */
        .preset-list {
            max-height: 280px;
            overflow-y: auto;
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .preset-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        
        .preset-item:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .preset-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .preset-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
        }
        
        .preset-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        .preset-item-actions {
            display: flex;
            gap: 6px;
        }
        
        .btn-preset-action {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 0.75rem;
        }
        
        .btn-preset-action:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn-preset-action.delete:hover {
            color: #ff5252;
            border-color: #ff5252;
        }
        
        .preset-empty {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .preset-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .preset-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        .preset-input:focus {
            border-color: var(--accent);
        }
        
        .preset-input::placeholder {
            color: var(--text-muted);
        }
        
        /* Catalog sections */
        .catalog-section {
            margin-bottom: 4px;
        }
        
        .catalog-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        
        .catalog-section-header:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        
        .catalog-section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .catalog-section-label i {
            font-size: 0.7rem;
            color: var(--accent);
        }
        
        .catalog-section-count {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 8px;
        }
        
        .catalog-section-chevron {
            font-size: 0.65rem;
            color: var(--text-muted);
            transition: transform 0.25s ease;
        }
        
        .catalog-section.open .catalog-section-chevron {
            transform: rotate(180deg);
        }
        
        .catalog-section-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 4px;
        }
        
        .catalog-section.open .catalog-section-items {
            max-height: 600px;
            padding: 8px 4px 4px 4px;
        }
        
        /* ===================== MOBILE LAYOUT ===================== */
        @media (max-width: 768px) {
            main {
                display: flex;
                flex-direction: column;
                padding: 12px;
                gap: 12px;
                padding-bottom: 90px; /* space for bottom nav */
            }
            
            .sidebar {
                display: none; /* hidden on mobile, shown via bottom nav */
            }
            
            .sidebar.mobile-visible {
                display: flex;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                bottom: 70px;
                z-index: 90;
                border-radius: 0;
                background: rgba(15, 12, 30, 0.98);
                backdrop-filter: blur(20px);
                padding: 16px;
                overflow-y: auto;
            }
            
            .rig-container {
                padding: 16px;
            }
            
            .pedalboard {
                gap: 12px;
            }
            
            .pedal-slot {
                min-width: 140px;
                max-width: 160px;
                padding: 10px;
            }
            
            /* Touch targets bigger on mobile */
            .btn {
                padding: 12px 18px;
                min-height: 44px;
            }
            
            .pedal-actions i {
                padding: 8px;
                min-width: 36px;
                min-height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .knob-input {
                height: 28px;
            }
            
            /* Bottom navigation */
            .mobile-bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 64px;
                background: rgba(15, 12, 30, 0.95);
                backdrop-filter: blur(20px);
                border-top: 1px solid var(--glass-border);
                z-index: 100;
                justify-content: space-around;
                align-items: center;
                padding: 0 8px;
            }
            
            .mobile-nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                padding: 8px 16px;
                min-width: 64px;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s ease;
                color: var(--text-muted);
            }
            
            .mobile-nav-item.active {
                color: var(--accent);
                background: rgba(255, 94, 54, 0.1);
            }
            
            .mobile-nav-item i {
                font-size: 1.2rem;
            }
            
            .mobile-nav-item span {
                font-size: 0.65rem;
                font-weight: 600;
            }
            
            /* FAB (Floating Action Button) */
            .mobile-fab {
                position: fixed;
                bottom: 80px;
                right: 16px;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 4px 20px var(--accent-glow);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 101;
                transition: all 0.2s ease;
                border: none;
                color: white;
                font-size: 1.4rem;
            }
            
            .mobile-fab:hover {
                transform: scale(1.05);
                background: #ff7350;
            }
            
            .mobile-fab:active {
                transform: scale(0.95);
            }
            
            /* Modal full-screen on mobile */
            .confirm-modal-dialog {
                width: calc(100% - 32px);
                max-width: 380px;
            }
            
            .preset-modal-dialog {
                width: calc(100% - 32px);
                max-width: 420px;
            }
            
            /* Pedalboard view visible by default on mobile */
            .rig-container.mobile-hidden {
                display: none;
            }
            
            /* Preset bar mobile */
            .preset-bar {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .preset-bar-title {
                width: 100%;
                margin-bottom: 4px;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-bottom-nav { display: none; }
            .mobile-fab { display: none; }
        }
        
        /* Toast notification */
        .toast-container {
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        
        .toast {
            background: rgba(25, 22, 45, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(255, 94, 54, 0.3);
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
            min-width: 200px;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast i {
            color: var(--accent);
            font-size: 1rem;
        }
        
        .toast-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .toast-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .toast-message {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            .toast-container {
                top: auto;
                bottom: 80px;
                right: 16px;
                left: 16px;
            }
            
            .toast {
                min-width: auto;
                transform: translateY(120%);
            }
            
            .toast.show {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    
    <header>
        <div class="brand">
            <i class="fa-solid fa-guitar"></i>
            <h1>AmpRig Studio</h1>
        </div>
        <div class="controls-master">
            <div class="status-bar">
                <div id="statusIndicator" class="status-indicator"></div>
                <span id="statusText">Audio non attivo</span>
            </div>
            <button id="btnAudioToggle" class="btn btn-accent">
                <i class="fa-solid fa-power-off"></i> Attiva Audio
            </button>
        </div>
    </header>
    
    <main>
        <aside class="sidebar">
            <h2>Libreria Effetti</h2>
            <div id="catalogList" class="effects-catalog"></div>
        </aside>
        
        <section class="rig-container">
            <div class="rig-header">
                <h2>Catena Audio Real-Time</h2>
                <span style="font-size: 0.8rem; color: var(--text-muted);">Trascina per riordinare gli effetti</span>
            </div>
            <div id="pedalboard" class="pedalboard"></div>
            <div class="preset-bar">
                <span class="preset-bar-title">Presets</span>
                <button class="btn-preset btn-preset-save" onclick="openSavePresetModal()">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                </button>
                <button class="btn-preset btn-preset-load" onclick="openLoadPresetModal()">

        ,
        {

        ];
        
        // 2. STATO AUDIO E ROUTING ENGINE
        let audioCtx = null;
        let micStreamNode = null;
        let activeRig = []; 
        
        const btnAudioToggle = document.getElementById('btnAudioToggle');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        
        // FULLSCREEN — richiede interazione utente, quindi lo triggeriamo
        // al primo click sul pulsante audio (e poi si può attivare/disattivare
        // in qualsiasi momento con F11 o dal bottone).
        function toggleFullscreen() {
            const doc = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(err => console.warn('Fullscreen negato:', err));
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
        
        // Entra in automatico al primo avvio audio (prima interazione utente reale)
        let fsTriggered = false;
        function tryAutoFullscreen() {
            if (!fsTriggered) {
                fsTriggered = true;
                toggleFullscreen();
            }
        }
        
        btnAudioToggle.addEventListener('click', async () => {
            if (!audioCtx) {
                await initAudio();
                tryAutoFullscreen();
            } else if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
                updateAudioStatus(true);
            } else {
                await audioCtx.suspend();
                updateAudioStatus(false);
            }
        });
        
        async function initAudio() {
            try {
                // Inizializza l'AudioContext senza latencyHint rigidi
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                
                // Microfono con vincoli per ridurre il rumore di fondo a monte:
                // - noiseSuppression: taglia il fruscio stazionario del microfono (fondamentale
                //   PRIMA di un distortore, che amplificherebbe il rumorerizona);
                // - autoGainControl: off, per non far pompare al browser il gain in automatico
                //   (altrimenti il distortore diventa imprevedibile e il noise sfugge di mano);
                // - echoCancellation: concentrato a off per coerenza (cuffie, nessun eco).
                if (!micStreamNode) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: true,
                            autoGainControl: false
                        }
                    });
                    micStreamNode = audioCtx.createMediaStreamSource(stream);
                }
                
                updateAudioStatus(true);
            } catch (err) {
                console.error("Errore inizializzazione audio:", err);
            }
        }
        
        function updateAudioStatus(isActive) {
            if (isActive) {
                statusIndicator.classList.add('active');
                statusText.innerText = "Audio Attivo";
                btnAudioToggle.classList.add('active');
                btnAudioToggle.innerHTML = `<i class="fa-solid fa-power-off"></i> Audio ON`;
            } else {
                statusIndicator.classList.remove('active');
                statusText.innerText = "Audio In Pausa";
                btnAudioToggle.classList.remove('active');
                btnAudioToggle.innerHTML = `<i class="fa-solid fa-power-off"></i> Attiva Audio`;
            }
        }
        
        // Carica il modulo WASM Faust
        // Carica un IR (ConvolverNode) — simulazione di cassa/ampli.
        // Un IR loader NON usa Faust: usa il nodo nativo ConvolverNode, che convolve un
        // impulso (.wav) col segnale. Va in serie esattamente come un pedale normale.
        
        
        async function loadIRFromPath(pedal) {
            if (!audioCtx || !pedal.irNode) return;
            try {
                const res = await fetch(pedal.def.irPath);
                if (!res.ok) return;
                const buf = await res.arrayBuffer();
                const decoded = await audioCtx.decodeAudioData(buf);
                pedal.irNode.buffer = decoded;
            } catch (err) {
                console.warn(`Impossibile caricare l'IR da percorso:`, err);
            }
        }
        
        // Crea i nodi per un pedale IR: la catena termina su gain (Volume);
        // pedal.irNode = ConvolverNode, pedal.node = GainNode*
        
        
        
        async function initIRPedal(pedal) {
            if (!audioCtx) return;
            const conv = audioCtx.createConvolver();
            const gain = audioCtx.createGain();
            const volDef = pedal.def.params.find(p => p.id === 'Volume');
            gain.gain.value = parseFloat(volDef ? volDef.default : 0.8);
            conv.connect(gain);
            pedal.irNode = conv;
            pedal.node = gain;
            pedal.faustInstance = null;
            // Se la registry ha un irPath (file .wav messo dal utente nel repo), lo carica in automatico.
            
            
            
            if (pedal.def.irPath) {
                await loadIRFromPath(pedal);
            }
        }
        
        async function loadPedalNode(pedal) {
            if (!audioCtx) return;
            // Pedale IR: niente Faust, solo ConvolverNode
            if (pedal.def.type === 'ir') {
                await initIRPedal(pedal);
                return;
            }
            try {
                const folder = pedal.def.folder.endsWith('/') ? pedal.def.folder : `${pedal.def.folder}/`;
                // Carichiamo il loader condiviso (js/faust-loader.js) invece di una copia
                // per-cartella: il loader ├¿ identico per tutti gli effetti.
                const { createFaustNode } = await import('./js/faust-loader.js');
                
                if (!createFaustNode) throw new Error("Funzione factory (createFaustNode) non trovata");
                
                /* Passiamo a createFaustNode la cartella dell'effetto: da l├¼ legge
                dsp-meta.json, dsp-module.wasm, ecc. e crea il nodo WebAudio puro. */
                const instance = await createFaustNode(audioCtx, folder, {
                    dspName: pedal.def.dspName,
                    voices: pedal.def.voices || 0
                });
                
                // Se la funzione ha creato autonomamente un microfono interno, lo colleghiamo al nostro contesto
                // IMPORTANTE: faustInstance DEVE essere il nodo audio effettivo (instance.faustNode),
                // non il wrapper { faustNode, dspMeta }: setParamValue() e destroy() sono metodi del nodo.
                pedal.faustInstance = instance && instance.faustNode ? instance.faustNode : instance;
                
                // Estraiamo solo il nodo WebAudio puro (senza lo stream microfonico di Faust)
                if (instance && instance.faustNode) {
                    pedal.node = instance.faustNode;
                } else if (instance && instance.getAudioNode) {
                    pedal.node = instance.getAudioNode();
                } else if (instance instanceof AudioNode) {
                    pedal.node = instance;
                } else if (instance && instance.node) {
                    pedal.node = instance.node;
                } else {
                    pedal.node = instance;
                }
                
            } catch (err) {
                console.error(`Errore caricamento WASM per ${pedal.def.name}:`, err);
            }
        }
        
        // Riconnette l'intera catena audio
        function rebuildAudioChain() {
            if (!audioCtx || !micStreamNode) return;
            
            // Disconnette ogni nodo
            micStreamNode.disconnect();
            activeRig.forEach(pedal => {
                if (pedal.node) pedal.node.disconnect();
            });
            
            let currentSource = micStreamNode;
            
            // Collega in serie tutti i pedali attivi
            activeRig.forEach(pedal => {
                if (pedal.node) {
                    currentSource.connect(pedal.node);
                    currentSource = pedal.node;
                }
            });
            
            // Uscita verso le cuffie/scheda M-Audio
            currentSource.connect(audioCtx.destination);
        }
        
        // 3. INTERFACCIA UTENTE E DRAG & DROP
        const catalogList = document.getElementById('catalogList');
        const pedalboard = document.getElementById('pedalboard');
        
        // Mobile view switching
        function switchMobileView(view) {
            const sidebar = document.querySelector('.sidebar');
            const rigContainer = document.querySelector('.rig-container');
            const presetBar = document.querySelector('.preset-bar');
            const navItems = document.querySelectorAll('.mobile-nav-item');
            
            // Update nav active state
            navItems.forEach(item => {
                item.classList.toggle('active', item.dataset.view === view);
            });
            
            // Show/hide content based on view
            if (view === 'rig') {
                sidebar.classList.remove('mobile-visible');
                rigContainer.classList.remove('mobile-hidden');
                presetBar.style.display = 'flex';
            } else if (view === 'catalog') {
                sidebar.classList.add('mobile-visible');
                rigContainer.classList.add('mobile-hidden');
                presetBar.style.display = 'none';
            } else if (view === 'presets') {
                sidebar.classList.remove('mobile-visible');
                rigContainer.classList.remove('mobile-hidden');
                presetBar.style.display = 'flex';
                openLoadPresetModal();
            }
        }
        
        function renderCatalog() {
            catalogList.innerHTML = '';
            
            // Group effects by category
            const categories = {};
            EFFECTS_REGISTRY.forEach(effect => {
                const cat = effect.category || 'Other';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(effect);
            });
            
            // Category icons
            const catIcons = {
                'Distortion': 'fa-solid fa-bolt',
                'Echo / Delay': 'fa-solid fa-clock',
                'Modulation': 'fa-solid fa-wave-square',
                'Amplificatore / IR': 'fa-solid fa-tower-broadcast'
            };
            
            // Create collapsible sections (default: collapsed)
            Object.entries(categories).forEach(([category, effects]) => {
                const section = document.createElement('div');
                section.className = 'catalog-section';
                
                const header = document.createElement('div');
                header.className = 'catalog-section-header';
                header.innerHTML = `
                    <span class="catalog-section-label">
                        <i class="${catIcons[category] || 'fa-solid fa-layer-group'}"></i>
                        ${category}
                    </span>
                    <span style="display:flex;align-items:center;gap:6px;">
                        <span class="catalog-section-count">${effects.length}</span>
                        <i class="fa-solid fa-chevron-down catalog-section-chevron"></i>
                    </span>
                `;
                
                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'catalog-section-items';
                
                effects.forEach(effect => {
                    const card = document.createElement('div');
                    card.className = 'effect-card';
                    card.innerHTML = `
              <div class="effect-info">
                <i class="effect-icon ${effect.icon || 'fa-solid fa-drum'}"></i>
                <h3>${effect.name}</h3>
              </div>
              <i class="fa-solid fa-plus-circle" style="color: var(--accent)"></i>
            `;
                    card.onclick = () => addEffectToRig(effect);
                    itemsContainer.appendChild(card);
                });
                
                header.addEventListener('click', () => {
                    section.classList.toggle('open');
                });
                
                section.appendChild(header);
                section.appendChild(itemsContainer);
                catalogList.appendChild(section);
            });
        }
        
        // Toast notification
        function showToast(title, message, icon = 'fa-check-circle') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <div class="toast-content">
                    <span class="toast-title">${title}</span>
                    <span class="toast-message">${message}</span>
                </div>
            `;
            container.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
        
        async function addEffectToRig(effectDef) {
            const instanceId = 'pedal_' + Date.now();
            const pedalData = {
                instanceId,
                def: effectDef,
                faustInstance: null,
                node: null,
                currentParams: {}
            };
            
            if (audioCtx) {
                await loadPedalNode(pedalData);
            }
            
            activeRig.push(pedalData);
            renderPedalboard();
            rebuildAudioChain();
            
            // Show toast notification
            showToast('Effetto aggiunto', effectDef.name, effectDef.icon || 'fa-check-circle');
        }
        
        // Custom confirm modal (Promise-based)
        function showConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                const msgEl = document.getElementById('confirmMessage');
                const okBtn = document.getElementById('confirmOk');
                const cancelBtn = document.getElementById('confirmCancel');
                
                msgEl.textContent = message;
                modal.classList.add('show');
                
                const cleanup = () => {
                    modal.classList.remove('show');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                };
                
                const onOk = () => { cleanup(); resolve(true); };
                const onCancel = () => { cleanup(); resolve(false); };
                
                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
            });
        }
        
        // RIMOZIONE PULITA DI UN PEDALE (Pulisce la memoria WASM ed elimina il nodo audio)
        async function removePedal(instanceId) {
            const pedal = activeRig.find(p => p.instanceId === instanceId);
            
            if (!pedal) return;
            
            const confirmed = await showConfirm(`Delete "${pedal.def.name}" from the rig?`);
            if (!confirmed) return;
            
            if (pedal.node) pedal.node.disconnect();
            if (pedal.faustInstance && pedal.faustInstance.destroy) {
                pedal.faustInstance.destroy();
            }
            
            activeRig = activeRig.filter(p => p.instanceId !== instanceId);
            renderPedalboard();
            rebuildAudioChain();
        }
        
        // PRESET SYSTEM — Save & recall rig configurations via localStorage
        const PRESETS_STORAGE_KEY = 'ampRigPresets';
        
        function getPresets() {
            try { return JSON.parse(localStorage.getItem(PRESETS_STORAGE_KEY)) || []; }
            catch { return []; }
        }
        
        function setPresets(presets) {
            localStorage.setItem(PRESETS_STORAGE_KEY, JSON.stringify(presets));
        }
        
        function savePreset() {
            const nameInput = document.getElementById('presetNameInput');
            const name = nameInput.value.trim();
            if (!name) { nameInput.focus(); return; }
            if (activeRig.length === 0) { alert('Add at least one pedal before saving.'); return; }
            
            const preset = {
                id: 'preset_' + Date.now(),
                name: name,
                date: new Date().toISOString(),
                rig: activeRig.map(p => ({ id: p.def.id, params: { ...p.currentParams } }))
            };
            
            const presets = getPresets();
            presets.push(preset);
            setPresets(presets);
            nameInput.value = '';
            closeSavePresetModal();
        }
        
        async function loadPreset(presetId) {
            const preset = getPresets().find(p => p.id === presetId);
            if (!preset) return;
            
            activeRig.forEach(p => {
                if (p.node) p.node.disconnect();
                if (p.faustInstance && p.faustInstance.destroy) p.faustInstance.destroy();
            });
            activeRig = [];
            
            for (const sp of preset.rig) {
                const def = EFFECTS_REGISTRY.find(e => e.id === sp.id);
                if (!def) continue;
                const instanceId = 'pedal_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                const pedalData = { instanceId, def, faustInstance: null, node: null, currentParams: { ...sp.params } };
                
                if (audioCtx) {
                    await loadPedalNode(pedalData);
                    for (const [paramId, value] of Object.entries(sp.params)) {
                        if (def.type === 'ir') {
                            if (paramId === 'Volume' && pedalData.node && pedalData.node.gain) pedalData.node.gain.value = value;
                        } else if (pedalData.faustInstance && typeof pedalData.faustInstance.setParamValue === 'function') {
                            const dspName = def.dspName || def.id;
                            pedalData.faustInstance.setParamValue(`/${dspName}/${paramId}`, value);
                        }
                    }
                }
                activeRig.push(pedalData);
            }
            
            renderPedalboard();
            rebuildAudioChain();
            closeLoadPresetModal();
        }
        
        async function deletePreset(presetId) {
            if (!await showConfirm('Delete this preset? This cannot be undone.')) return;
            setPresets(getPresets().filter(p => p.id !== presetId));
            renderPresetList();
        }
        
        function openSavePresetModal() {
            if (activeRig.length === 0) { alert('Add at least one pedal before saving a preset.'); return; }
            document.getElementById('savePresetModal').classList.add('show');
            setTimeout(() => document.getElementById('presetNameInput').focus(), 100);
        }
        
        function closeSavePresetModal() {
            document.getElementById('savePresetModal').classList.remove('show');
        }
        
        function openLoadPresetModal() {
            const presets = getPresets();
            if (presets.length === 0) { alert('No presets saved yet.'); return; }
            renderPresetList();
            document.getElementById('loadPresetModal').classList.add('show');
        }
        
        function closeLoadPresetModal() {
            document.getElementById('loadPresetModal').classList.remove('show');
        }
        
        function renderPresetList() {
            const listEl = document.getElementById('presetList');
            const presets = getPresets();
            
            if (presets.length === 0) {
                listEl.innerHTML = '<div class="preset-empty"><i class="fa-solid fa-inbox"></i><br>No presets saved yet</div>';
                return;
            }
            
            listEl.innerHTML = presets.map(preset => {
                const d = new Date(preset.date);
                const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const pedalNames = preset.rig.map(p => {
                    const def = EFFECTS_REGISTRY.find(e => e.id === p.id);
                    return def ? def.name : p.id;
                }).join(', ');
                
                return `
                    <div class="preset-item">
                        <div class="preset-info">
                            <span class="preset-name">${preset.name}</span>
                            <span class="preset-meta">${dateStr} · ${preset.rig.length} pedal${preset.rig.length !== 1 ? 's' : ''}</span>
                            <span class="preset-meta" style="font-size:0.65rem;opacity:0.7;">${pedalNames}</span>
                        </div>
                        <div class="preset-item-actions">
                            <button class="btn-preset-action load" onclick="loadPreset('${preset.id}')" title="Load"><i class="fa-solid fa-upload"></i></button>
                            <button class="btn-preset-action delete" onclick="deletePreset('${preset.id}')" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderPedalboard() {
            pedalboard.innerHTML = '';
            
            activeRig.forEach((pedal, index) => {
                const slot = document.createElement('div');
                slot.className = 'pedal-slot';
                slot.draggable = true;
                slot.dataset.index = index;
                slot.dataset.instance = pedal.instanceId;
                
                // Immagini di sfondo: espanso e ridotto
                if (pedal.def.bgExpanded) {
                    slot.style.setProperty('--bg-expanded', `url(${pedal.def.bgExpanded})`);
                    slot.style.setProperty('--bg-collapsed', `url(${pedal.def.bgCollapsed || pedal.def.bgExpanded})`);
                    slot.style.backgroundImage = `url(${pedal.def.bgExpanded})`;
                }
                
                slot.innerHTML = `
          <div class="pedal-header">
            <i class="pedal-icone ${pedal.def.icon || 'fa-solid fa-drum'}"></i>
            <span class="pedal-title">${pedal.def.name}</span>
            <div class="pedal-actions">
              <i class="fa-solid fa-chevron-up pedal-collapse" draggable="false" onclick="toggleCollapse('${pedal.instanceId}')"></i>
              <i class="fa-solid fa-trash" draggable="false" onclick="removePedal('${pedal.instanceId}')"></i>
            </div>
          </div>
          <div class="pedal-controls">
            ${pedal.def.params.map(p => {
                  const savedVal = pedal.currentParams.hasOwnProperty(p.id) ? pedal.currentParams[p.id] : p.default;
                  return `
              <div class="knob-container">
                <span class="knob-label">${p.label}</span>
                <input type="range" class="knob-input" draggable="false" 
                  min="${p.min}" max="${p.max}" step="${p.step}" value="${savedVal}"
                  oninput="updateParam('${pedal.instanceId}', '${p.id}', this.value); this.nextElementSibling.textContent = parseFloat(this.value).toFixed(2)">
                <span class="knob-value">${parseFloat(savedVal).toFixed(2)}</span>
              </div>
                  `;
                }).join('')}
            ${pedal.def.type === 'ir' ? `
              <div class="knob-container ir-upload-row">
                <span class="knob-label">IR (.wav)</span>
                <label class="ir-btn" draggable="false" style="cursor:pointer;color:var(--accent);border:1px solid var(--glass-border);padding:4px 8px;border-radius:6px;font-size:0.75rem;">Sfoglia<input type="file" class="ir-file" accept=".wav,audio/wav" hidden></label>
                <span class="ir-name" style="color:var(--text-muted);font-size:0.7rem;">—</span>
              </div>
            ` : ''}
          </div>
        `;
                
                slot.addEventListener('dragstart', handleDragStart);
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('drop', handleDrop);
                slot.addEventListener('dragend', handleDragEnd);
                
                // Traccia dove è partito il mousedown: se è dentro un controllo,
                // handleDragStart rifiuterà il drag. Questo copre anche il caso
                // in cui dragstart parte dallo slot ma il click era sullo slider.
                slot.addEventListener('mousedown', e => {
                    mousedownInControl = !!e.target.closest('.pedal-controls, .pedal-actions, .ir-btn, .knob-input, .ir-file, input');
                });
                
                // Blocca il drag start direttamente su slider e file input,
                // altrimenti l'evento "bubba" verso lo slot (che è draggable=true)
                // e il browser interpreta lo spostamento dello slider come drag della card.
                slot.querySelectorAll('.knob-input, .ir-file').forEach(el => {
                    el.addEventListener('dragstart', e => {
                        e.preventDefault();
                        e.stopPropagation();
                    });
                });
                
                pedalboard.appendChild(slot);
                
                if (pedal.def.type === 'ir') {
                    const input = slot.querySelector('.ir-file');
                    input.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (file && pedal.irNode) {
                            try {
                                const buf = await file.arrayBuffer();
                                const decoded = await audioCtx.decodeAudioData(buf);
                                pedal.irNode.buffer = decoded;
                                const nameEl = slot.querySelector('.ir-name');
                                if (nameEl) nameEl.textContent = file.name;
                            } catch (err) {
                                console.error('Errore caricamento IR:', err);
                            }
                        }
                    });
                }
            });
        }
        
        function toggleCollapse(instanceId) {
            const slot = document.querySelector(`.pedal-slot[data-instance="${instanceId}"]`);
            if (slot) {
                slot.classList.toggle('collapsed');
                const ic = slot.querySelector('.pedal-collapse');
                if (ic) ic.classList.toggle('fa-chevron-down');
            }
        }

        function updateParam(instanceId, paramId, value) {
            const pedal = activeRig.find(p => p.instanceId === instanceId);
            if (!pedal) return;
            
            // Salva il valore corrente per preservarlo al re-render
            pedal.currentParams[paramId] = parseFloat(value);
            
            // Pedale IR: il "Volume" controlla il gain del ConvolverNode(la catena termina su gain.
            if (pedal.def.type === 'ir') {
                if (paramId === 'Volume' && pedal.node && pedal.node.gain) {
                    pedal.node.gain.value = parseFloat(value);
                }
                return;
            }
            if (pedal.faustInstance && typeof pedal.faustInstance.setParamValue === 'function') {
                // Il prefisso dell'address generato da Faust e& il NOME DSP (dspName),
                // NON l'id UI della registry (che può essere arbitrario, es. 'rat2').
                const dspName = pedal.def.dspName || pedal.def.id;
                const paramPath = `/${dspName}/${paramId}`;
                pedal.faustInstance.setParamValue(paramPath, parseFloat(value));
            }
        }
        
        /* DRAG & DROP HANDLERS */
        let dragSrcIndex = null;
        let mousedownInControl = false;
        
        function handleDragStart(e) {
            // Se il mousedown era partito da un controllo (slider, bottone, upload),
            // rifiuta il drag — anche se dragstart parte dallo slot (che non è dentro .pedal-controls).
            if (mousedownInControl || e.target.closest('.pedal-controls, .pedal-actions, .ir-btn, .knob-input, .ir-file, input')) {
                e.preventDefault();
                mousedownInControl = false;
                return;
            }
            mousedownInControl = false;
            dragSrcIndex = Number(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }
        
        function handleDrop(e) {
            e.stopPropagation();
            const targetIndex = Number(this.dataset.index);
            
            if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                const movedPedal = activeRig.splice(dragSrcIndex, 1)[0];
                activeRig.splice(targetIndex, 0, movedPedal);
                
                renderPedalboard();
                rebuildAudioChain();
            }
            return false;
        }
        
        function handleDragEnd() {
            this.classList.remove('dragging');
        }
        
        // Service Worker Registration per PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('Service Worker Registrato!', reg))
                .catch(err => console.error('Errore SW:', err));
            });
        }
        
        // Avvio
        renderCatalog();
    </script>
    
    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-dialog">
            <div class="modal-icon">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <div class="modal-title">Delete Pedal</div>
            <div id="confirmMessage" class="modal-message">Are you sure?</div>
            <div class="modal-actions">
                <button class="btn-modal btn-modal-cancel" id="confirmCancel">Cancel</button>
                <button class="btn-modal btn-modal-confirm" id="confirmOk">Delete</button>
            </div>
        </div>
    </div>
    
    <!-- Save Preset Modal -->
    <div id="savePresetModal" class="modal-overlay">
        <div class="modal-dialog">
            <div class="modal-icon">
                <i class="fa-solid fa-floppy-disk"></i>
            </div>
            <div class="modal-title">Save Preset</div>
            <div class="modal-message">Save your current rig configuration as a preset.</div>
            <div class="preset-input-row">
                <input type="text" id="presetNameInput" class="preset-input" placeholder="Preset name..." maxlength="30">
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-modal-cancel" onclick="closeSavePresetModal()">Cancel</button>
                <button class="btn-modal btn-modal-confirm" onclick="savePreset()">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Load Preset Modal -->
    <div id="loadPresetModal" class="modal-overlay">
        <div class="modal-dialog">
            <div class="modal-icon">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <div class="modal-title">Load Preset</div>
            <div class="modal-message">Select a preset to load into your rig.</div>
            <div id="presetList" class="preset-list"></div>
            <div class="modal-actions">
                <button class="btn-modal btn-modal-cancel" onclick="closeLoadPresetModal()">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
